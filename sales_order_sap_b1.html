<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Order - SAP Business One Style</title>
  <style>
    :root {
      --bg-page: #e9edf2;
      --bg-panel: #f6f8fa;
      --border: #b9c2cd;
      --border-dark: #8c9ba5;
      --text: #1d2630;
      --text-muted: #5d6b7a;
      --bg-input: #ffffff;
      --bg-readonly: #e4e8ed;
      --bg-header: #dde3ea;
      --btn-primary: #f0b429;
      --btn-primary-hover: #e5a717;
      --btn-primary-text: #1d2630;
      --btn-sec: #e4e8ed;
      --btn-sec-border: #b9c2cd;
      --btn-sec-text: #1d2630;
      --msg-error: #c62828;
      --msg-success: #2e7d32;
      --tab-active-bg: #ffffff;
      --tab-inactive-bg: #e4e8ed;
      --grid-row-alt: #fbfcfd;
      --titlebar-bg: #374151;
      --titlebar-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-page: #1a2028;
      --bg-panel: #222a34;
      --border: #3d4854;
      --border-dark: #586877;
      --text: #e6ebf0;
      --text-muted: #9aa5b1;
      --bg-input: #161c23;
      --bg-readonly: #2a323d;
      --bg-header: #2c3540;
      --btn-primary: #f0b429;
      --btn-primary-hover: #e5a717;
      --btn-primary-text: #1d2630;
      --btn-sec: #2a323d;
      --btn-sec-border: #3d4854;
      --btn-sec-text: #e6ebf0;
      --msg-error: #c62828;
      --msg-success: #2e7d32;
      --tab-active-bg: #222a34;
      --tab-inactive-bg: #161c23;
      --grid-row-alt: #1f262f;
      --titlebar-bg: #111827;
      --titlebar-text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
    }

    /* Window Container (SAP B1 Document Style) */
    .sap-window {
      background-color: var(--bg-panel);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
    }

    /* Window Title Bar */
    .sap-titlebar {
      background-color: var(--titlebar-bg);
      color: var(--titlebar-text);
      padding: 5px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      user-select: none;
    }

    .sap-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sap-title-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--titlebar-text);
      font-size: 11px;
      padding: 2px 7px;
      cursor: pointer;
      font-family: inherit;
    }
    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Document Header Area */
    .sap-header-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 28px;
      padding: 12px 14px 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sap-field-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }

    .sap-field-row label {
      width: 125px;
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .sap-field-row label.required::after {
      content: " *";
      color: var(--msg-error);
      font-weight: bold;
    }

    .sap-field-control {
      flex: 1;
      max-width: 240px;
    }

    .sap-header-right {
      justify-self: end;
      width: 100%;
      max-width: 370px;
    }

    .sap-header-right .sap-field-row {
      justify-content: flex-end;
    }

    .sap-header-right label {
      text-align: right;
      padding-right: 10px;
      width: 120px;
    }

    .sap-input {
      width: 100%;
      height: 22px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      background-color: var(--bg-input);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .sap-input:focus {
      border-color: #3b82f6;
    }

    .sap-input[readonly] {
      background-color: var(--bg-readonly);
      color: var(--text);
      cursor: default;
    }

    /* Tab Strip */
    .sap-tabs-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px 0 12px;
      background-color: var(--bg-panel);
    }

    .sap-tab-btn {
      padding: 4px 16px;
      background-color: var(--tab-inactive-bg);
      border: 1px solid var(--border);
      border-bottom: none;
      margin-right: 4px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
      border-top-left-radius: 2px;
      border-top-right-radius: 2px;
    }

    .sap-tab-btn.active {
      background-color: var(--tab-active-bg);
      font-weight: 700;
      border-bottom: 1px solid var(--tab-active-bg);
      margin-bottom: -1px;
    }

    /* Tab Contents Area */
    .sap-tab-body {
      padding: 10px 12px;
      background-color: var(--bg-panel);
      min-height: 220px;
    }

    .sap-tab-panel {
      display: none;
    }
    .sap-tab-panel.active {
      display: block;
    }

    /* Table Grid Container */
    .grid-container {
      border: 1px solid var(--border);
      background-color: var(--bg-input);
      max-height: 320px;
      overflow-y: auto;
      overflow-x: auto;
    }

    .sap-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      min-width: 820px;
    }

    .sap-table th {
      background-color: var(--bg-header);
      border: 1px solid var(--border);
      padding: 4px 6px;
      font-weight: 600;
      font-size: 11.5px;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 2;
      user-select: none;
    }

    .sap-table td {
      border: 1px solid var(--border);
      padding: 0;
      height: 23px;
    }

    .sap-table tr:nth-child(even) td {
      background-color: var(--grid-row-alt);
    }

    .cell-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      padding: 2px 5px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }

    .cell-input:focus {
      background-color: rgba(59, 130, 246, 0.08);
    }

    .cell-input[readonly] {
      background-color: var(--bg-readonly);
      color: var(--text);
      cursor: default;
    }

    .text-right {
      text-align: right;
    }
    .text-center {
      text-align: center;
    }

    .btn-delete-row {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      height: 100%;
      line-height: 1;
    }
    .btn-delete-row:hover:not(:disabled) {
      color: var(--msg-error);
      background: rgba(198, 40, 40, 0.1);
    }
    .btn-delete-row:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    /* Advance & Remarks Panel Controls */
    .advance-form-group, .remarks-form-group {
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sap-textarea {
      width: 100%;
      border: 1px solid var(--border);
      background-color: var(--bg-input);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 6px;
      outline: none;
      resize: vertical;
    }
    .sap-textarea:focus {
      border-color: #3b82f6;
    }

    /* Bottom Section */
    .sap-bottom-section {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 14px 12px 14px;
      border-top: 1px solid var(--border);
    }

    .sap-bottom-left {
      width: 100%;
      max-width: 380px;
    }

    .sap-bottom-right {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .total-row label {
      color: var(--text-muted);
      width: 160px;
    }

    .total-input {
      width: 150px;
      height: 22px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      background-color: var(--bg-readonly);
      color: var(--text);
      text-align: right;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }

    .total-due {
      font-weight: 700;
      color: var(--text);
      font-size: 12.5px;
    }

    /* Footer Controls Bar */
    .sap-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background-color: var(--bg-panel);
    }

    .btn-add {
      background-color: var(--btn-primary);
      color: var(--btn-primary-text);
      border: 1px solid #d49b1a;
      padding: 3px 22px;
      height: 25px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add:hover {
      background-color: var(--btn-primary-hover);
    }

    .btn-cancel {
      background-color: var(--btn-sec);
      color: var(--btn-sec-text);
      border: 1px solid var(--btn-sec-border);
      padding: 3px 18px;
      height: 25px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel:hover {
      background-color: var(--bg-header);
    }

    /* Status Message Bar */
    .sap-message-bar {
      margin-left: 12px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .sap-message-bar.error {
      display: inline-block;
      background-color: var(--msg-error);
      color: #ffffff;
    }

    .sap-message-bar.success {
      display: inline-block;
      background-color: var(--msg-success);
      color: #ffffff;
    }

    /* Responsive Breakpoint for Mobile (< 760px) */
    @media (max-width: 760px) {
      .sap-header-section {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .sap-header-right {
        justify-self: start;
        max-width: 100%;
      }
      .sap-header-right .sap-field-row {
        justify-content: flex-start;
      }
      .sap-header-right label {
        text-align: left;
        padding-right: 0;
        width: 125px;
      }
      .sap-bottom-section {
        flex-direction: column;
      }
      .sap-bottom-right {
        max-width: 100%;
      }
      .total-row label {
        width: 140px;
      }
      .total-input {
        flex: 1;
        max-width: 200px;
      }
      .sap-footer {
        flex-wrap: wrap;
      }
      .sap-message-bar {
        margin-left: 0;
        margin-top: 6px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- SAP Business One Window Frame -->
  <div class="sap-window">
    
    <!-- Titlebar -->
    <div class="sap-titlebar">
      <div class="sap-title-left">
        <span>Sales Order</span>
      </div>
      <div class="sap-title-right">
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">Theme: Light</button>
      </div>
    </div>

    <!-- Header Section (Two Columns) -->
    <div class="sap-header-section">
      
      <!-- Left Column -->
      <div class="sap-header-left">
        <div class="sap-field-row">
          <label for="customerInput">Customer</label>
          <div class="sap-field-control">
            <input type="text" id="customerInput" class="sap-input" value="WALK-IN">
          </div>
        </div>

        <div class="sap-field-row">
          <label for="nameInput">Name</label>
          <div class="sap-field-control">
            <input type="text" id="nameInput" class="sap-input" placeholder="Customer name">
          </div>
        </div>

        <div class="sap-field-row">
          <label for="mobileInput" class="required">Mobile</label>
          <div class="sap-field-control">
            <input type="tel" id="mobileInput" class="sap-input" placeholder="10-digit number" inputmode="numeric">
          </div>
        </div>

        <div class="sap-field-row">
          <label for="refNoInput">Customer Ref. No.</label>
          <div class="sap-field-control">
            <input type="text" id="refNoInput" class="sap-input">
          </div>
        </div>

        <div class="sap-field-row">
          <label for="currencyInput">Currency</label>
          <div class="sap-field-control">
            <input type="text" id="currencyInput" class="sap-input" value="INR" readonly>
          </div>
        </div>
      </div>

      <!-- Right Column -->
      <div class="sap-header-right">
        <div class="sap-field-row">
          <label for="docNoInput">No.</label>
          <div class="sap-field-control">
            <input type="text" id="docNoInput" class="sap-input" value="SO-00001" readonly>
          </div>
        </div>

        <div class="sap-field-row">
          <label for="statusInput">Status</label>
          <div class="sap-field-control">
            <input type="text" id="statusInput" class="sap-input" value="Open" readonly>
          </div>
        </div>

        <div class="sap-field-row">
          <label for="postingDateInput">Posting Date</label>
          <div class="sap-field-control">
            <input type="date" id="postingDateInput" class="sap-input">
          </div>
        </div>

        <div class="sap-field-row">
          <label for="deliveryDateInput" class="required">Delivery Date</label>
          <div class="sap-field-control">
            <input type="date" id="deliveryDateInput" class="sap-input">
          </div>
        </div>

        <div class="sap-field-row">
          <label for="docDateInput">Document Date</label>
          <div class="sap-field-control">
            <input type="date" id="docDateInput" class="sap-input">
          </div>
        </div>
      </div>

    </div>

    <!-- Tabs Strip -->
    <div class="sap-tabs-bar">
      <button type="button" class="sap-tab-btn active" id="tabBtnContents" onclick="switchTab('contents')">Contents</button>
      <button type="button" class="sap-tab-btn" id="tabBtnAdvance" onclick="switchTab('advance')">Advance</button>
      <button type="button" class="sap-tab-btn" id="tabBtnRemarks" onclick="switchTab('remarks')">Remarks</button>
    </div>

    <!-- Tab Contents Panels -->
    <div class="sap-tab-body">
      
      <!-- TAB 1: CONTENTS (Item Grid) -->
      <div class="sap-tab-panel active" id="panelContents">
        <div class="grid-container">
          <table class="sap-table" id="itemsTable">
            <thead>
              <tr>
                <th style="width: 32px; text-align: center;">#</th>
                <th style="width: 105px;">Item No.</th>
                <th style="width: 250px;">Item Description</th>
                <th style="width: 75px; text-align: right;">Quantity</th>
                <th style="width: 95px; text-align: right;">Unit Price</th>
                <th style="width: 80px; text-align: right;">Discount %</th>
                <th style="width: 70px; text-align: right;">GST %</th>
                <th style="width: 105px; text-align: right;">Total (LC)</th>
                <th style="width: 30px; text-align: center;"></th>
              </tr>
            </thead>
            <tbody id="itemsTbody">
              <!-- Dynamic Rows Rendered Here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- TAB 2: ADVANCE -->
      <div class="sap-tab-panel" id="panelAdvance">
        <div class="advance-form-group">
          <div class="sap-field-row">
            <label for="paymentModeSelect">Payment Mode</label>
            <div class="sap-field-control">
              <select id="paymentModeSelect" class="sap-input">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
              </select>
            </div>
          </div>

          <div class="sap-field-row">
            <label for="advanceReceivedInput">Advance Received</label>
            <div class="sap-field-control">
              <input type="number" id="advanceReceivedInput" class="sap-input text-right" min="0" step="0.01" placeholder="0.00" oninput="handleAdvanceChange()">
            </div>
          </div>

          <div class="sap-field-row">
            <label for="balanceDueInput">Balance Due</label>
            <div class="sap-field-control">
              <input type="text" id="balanceDueInput" class="sap-input text-right" value="0.00" readonly>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB 3: REMARKS -->
      <div class="sap-tab-panel" id="panelRemarks">
        <div class="remarks-form-group">
          <label for="remarksInput" style="color: var(--text-muted); font-size: 12px;">Order Notes & Remarks:</label>
          <textarea id="remarksInput" class="sap-textarea" rows="6" placeholder="Enter special packing, delivery or customer instructions..."></textarea>
        </div>
      </div>

    </div>

    <!-- Bottom Section: Sales Employee/Owner & Totals -->
    <div class="sap-bottom-section">
      
      <!-- Bottom Left -->
      <div class="sap-bottom-left">
        <div class="sap-field-row">
          <label for="salesEmployeeSelect">Sales Employee</label>
          <div class="sap-field-control" style="max-width: 200px;">
            <select id="salesEmployeeSelect" class="sap-input">
              <option value="none">-No Sales Employee-</option>
              <option value="Admin">Admin Staff</option>
              <option value="Counter1">Counter Operator</option>
              <option value="SalesTeam">Sales Team</option>
            </select>
          </div>
        </div>

        <div class="sap-field-row">
          <label for="ownerInput">Owner</label>
          <div class="sap-field-control" style="max-width: 200px;">
            <input type="text" id="ownerInput" class="sap-input" value="Counter 1" readonly>
          </div>
        </div>
      </div>

      <!-- Bottom Right: Totals -->
      <div class="sap-bottom-right">
        <div class="total-row">
          <label>Total Before Discount</label>
          <input type="text" id="totalBeforeDisc" class="total-input" value="0.00" readonly>
        </div>
        <div class="total-row">
          <label>Discount</label>
          <input type="text" id="totalDisc" class="total-input" value="0.00" readonly>
        </div>
        <div class="total-row">
          <label>Rounding</label>
          <input type="text" id="totalRounding" class="total-input" value="0.00" readonly>
        </div>
        <div class="total-row">
          <label>Tax (CGST + SGST)</label>
          <input type="text" id="totalTax" class="total-input" value="0.00" readonly>
        </div>
        <div class="total-row">
          <label class="total-due">Total Payment Due</label>
          <input type="text" id="totalPaymentDue" class="total-input total-due" value="0.00" readonly>
        </div>
      </div>

    </div>

    <!-- Footer Action Buttons & Message Area -->
    <div class="sap-footer">
      <button type="button" class="btn-add" id="btnAddOrder" onclick="handleAddOrder()">Add</button>
      <button type="button" class="btn-cancel" id="btnCancelOrder" onclick="handleCancelOrder()">Cancel</button>
      <div id="messageBar" class="sap-message-bar"></div>
    </div>

  </div>

  <!-- HTML5 Datalist for Item Autocomplete Lookup -->
  <datalist id="itemSuggestionsList">
    <!-- Injected dynamically in JavaScript -->
  </datalist>

    // Helper: Format Indian Number (e.g., 8,379.00 or -0.21)
    function formatINR(val) {
      if (typeof val !== 'number' || isNaN(val)) return '0.00';
      const isNeg = val < 0;
      const absVal = Math.abs(val);
      const fixed = absVal.toFixed(2);
      const parts = fixed.split('.');
      let intPart = parts[0];
      const decPart = parts[1];

      // Indian comma grouping: 3 digits, then every 2 digits
      if (intPart.length > 3) {
        const lastThree = intPart.substring(intPart.length - 3);
        const remaining = intPart.substring(0, intPart.length - 3);
        intPart = remaining.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + lastThree;
      }
      return (isNeg ? '-' : '') + intPart + '.' + decPart;
    }

    // Helper: ISO Date String (YYYY-MM-DD)
    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Format Running Order Number (SO-00001)
    function formatOrderNumber(num) {
      return 'SO-' + String(num).padStart(5, '0');
    }

      const dl = document.getElementById('itemSuggestionsList');

      resetForm();

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeBtn').textContent = 'Theme: Dark';
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeBtn').textContent = 'Theme: Light';
      }
    }

    // Switch Tabs
    function switchTab(tabName) {
      const tabs = ['contents', 'advance', 'remarks'];
      tabs.forEach(t => {
        const btn = document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1));
        const panel = document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1));
        if (t === tabName) {
          btn.classList.add('active');
          panel.classList.add('active');
        } else {
          btn.classList.remove('active');
          panel.classList.remove('active');
        }
      });
    }

        // Item Description Col (Read-only)
        const tdDesc = document.createElement('td');
        const inDesc = document.createElement('input');
        inDesc.type = 'text';
        inDesc.className = 'cell-input';
        inDesc.readOnly = true;
        inDesc.value = row.desc;
        tdDesc.appendChild(inDesc);
        tr.appendChild(tdDesc);

        // Quantity Col
        const tdQty = document.createElement('td');
        const inQty = document.createElement('input');
        inQty.type = 'number';
        inQty.className = 'cell-input text-right';
        inQty.min = '0';
        inQty.step = '1';
        inQty.value = row.qty !== '' ? row.qty : '';
        inQty.oninput = (e) => handleCellChange(idx, 'qty', e.target.value);
        tdQty.appendChild(inQty);
        tr.appendChild(tdQty);

        // Unit Price Col
        const tdPrice = document.createElement('td');
        const inPrice = document.createElement('input');
        inPrice.type = 'number';
        inPrice.className = 'cell-input text-right';
        inPrice.step = '0.01';
        inPrice.min = '0';
        inPrice.value = row.price !== '' ? row.price : 0;
        inPrice.oninput = (e) => handleCellChange(idx, 'price', e.target.value);
        tdPrice.appendChild(inPrice);
        tr.appendChild(tdPrice);

        // Discount % Col
        const tdDisc = document.createElement('td');
        const inDisc = document.createElement('input');
        inDisc.type = 'number';
        inDisc.className = 'cell-input text-right';
        inDisc.min = '0';
        inDisc.max = '100';
        inDisc.step = '0.01';
        inDisc.value = row.disc !== undefined ? row.disc : 0;
        inDisc.oninput = (e) => handleCellChange(idx, 'disc', e.target.value);
        tdDisc.appendChild(inDisc);
        tr.appendChild(tdDisc);

        // GST % Col
        const tdGst = document.createElement('td');
        const inGst = document.createElement('input');
        inGst.type = 'number';
        inGst.className = 'cell-input text-right';
        inGst.min = '0';
        inGst.step = '0.01';
        inGst.value = row.gst !== undefined ? row.gst : 5;
        inGst.oninput = (e) => handleCellChange(idx, 'gst', e.target.value);
        tdGst.appendChild(inGst);
        tr.appendChild(tdGst);

        // Total (LC) Col (Read-only)
        const tdTotal = document.createElement('td');
        const inTotal = document.createElement('input');
        inTotal.type = 'text';
        inTotal.className = 'cell-input text-right';
        inTotal.readOnly = true;
        inTotal.value = formatINR(row.totalLC);
        tdTotal.appendChild(inTotal);
        tr.appendChild(tdTotal);

        // Delete (x) Col
        const tdDel = document.createElement('td');
        tdDel.className = 'text-center';
        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn-delete-row';
        btnDel.innerHTML = '&times;';
        btnDel.title = 'Remove row';
        btnDel.disabled = gridRows.length <= 1;
        btnDel.onclick = () => deleteRow(idx);
        tdDel.appendChild(btnDel);
        tr.appendChild(tdDel);

        tbody.appendChild(tr);
      });
    }

    // Handle Item No Selection or Typing
    function handleItemNoChange(idx, val) {
      const row = gridRows[idx];
      row.itemCode = val;

      const item = ITEM_MAP.get(val);
      if (item) {
        row.desc = item.desc;
        row.price = item.price;
        row.gst = item.gst || 5;
        if (row.qty === '' || parseFloat(row.qty) === 0) {
          row.qty = 1;
        }
      } else {
        row.desc = '';
      }

      // Auto add new row if editing last row and item code is non-empty
      if (idx === gridRows.length - 1 && val.trim() !== '') {
        gridRows.push(createEmptyRow());
      }

      renderGrid();
      recalculate();
    }

    // Handle Numeric Input changes
    function handleCellChange(idx, field, val) {
      const row = gridRows[idx];
      row[field] = val;
      recalculate();
      // Update Total LC cell directly
      const tbody = document.getElementById('itemsTbody');
      if (tbody.children[idx]) {
        const totalInput = tbody.children[idx].querySelector('td:nth-child(8) input');
        if (totalInput) totalInput.value = formatINR(row.totalLC);
      }
    }

    // Delete Row
    function deleteRow(idx) {
      if (gridRows.length <= 1) return;
      gridRows.splice(idx, 1);
      renderGrid();
      recalculate();
    }

    // Recalculate Totals
    let currentCalculations = {
      totalBeforeDisc: 0,
      totalDiscount: 0,
      totalTax: 0,
      rawTotal: 0,
      paymentDue: 0,
      rounding: 0
    };

    function recalculate() {
      let grossSum = 0;
      let discSum = 0;
      let taxSum = 0;

      gridRows.forEach(row => {
        const qty = parseFloat(row.qty) || 0;
        const price = parseFloat(row.price) || 0;
        const discPct = Math.min(100, Math.max(0, parseFloat(row.disc) || 0));
        const gstPct = parseFloat(row.gst) || 0;

        const gross = qty * price;
        const discount = gross * (discPct / 100);
        const net = gross - discount;
        const lineTax = net * (gstPct / 100);

        row.totalLC = net;
        grossSum += gross;
        discSum += discount;
        taxSum += lineTax;
      });

      const rawTotal = grossSum - discSum + taxSum;
      const paymentDue = Math.round(rawTotal);
      const rounding = paymentDue - rawTotal;

      currentCalculations = {
        totalBeforeDisc: grossSum,
        totalDiscount: discSum,
        totalTax: taxSum,
        rawTotal: rawTotal,
        paymentDue: paymentDue,
        rounding: rounding
      };

      document.getElementById('totalBeforeDisc').value = formatINR(grossSum);
      document.getElementById('totalDisc').value = formatINR(discSum);
      document.getElementById('totalTax').value = formatINR(taxSum);
      document.getElementById('totalRounding').value = formatINR(rounding);
      document.getElementById('totalPaymentDue').value = formatINR(paymentDue);

      handleAdvanceChange();
    }

    // Handle Advance Received Change & Balance Due Calculation
    function handleAdvanceChange() {
      const advInput = document.getElementById('advanceReceivedInput');
      const advVal = parseFloat(advInput.value) || 0;
      const balanceDue = Math.max(0, currentCalculations.paymentDue - advVal);
      document.getElementById('balanceDueInput').value = formatINR(balanceDue);
    }

    // Display Message Bar
    function showMessage(msg, type) {
      const bar = document.getElementById('messageBar');
      bar.textContent = msg;
      bar.className = 'sap-message-bar ' + (type === 'error' ? 'error' : 'success');
      bar.style.display = 'inline-block';
    }

    function clearMessage() {
      const bar = document.getElementById('messageBar');
      bar.textContent = '';
      bar.className = 'sap-message-bar';
      bar.style.display = 'none';
    }

    // Validation & Add Order Handler
    function handleAddOrder() {
      clearMessage();

      // Check 1: At least one line has an item and Quantity greater than 0
      const validLines = gridRows.filter(r => r.itemCode.trim() !== '' && (parseFloat(r.qty) || 0) > 0);
      if (validLines.length === 0) {
        showMessage('Add at least one item with a quantity.', 'error');
        switchTab('contents');
        return;
      }

      // Check 2: Delivery Date is filled
      const deliveryDate = document.getElementById('deliveryDateInput').value;
      if (!deliveryDate) {
        showMessage('Delivery date is required.', 'error');
        document.getElementById('deliveryDateInput').focus();
        return;
      }

      // Check 3: Mobile is filled
      const mobile = document.getElementById('mobileInput').value.trim();
      if (!mobile) {
        showMessage("Enter the customer's mobile number so the order can be traced.", 'error');
        document.getElementById('mobileInput').focus();
        return;
      }

      // Check 4: Advance received is not more than Total Payment Due
      const advanceReceived = parseFloat(document.getElementById('advanceReceivedInput').value) || 0;
      if (advanceReceived > currentCalculations.paymentDue) {
        showMessage('Advance cannot be more than the total.', 'error');
        switchTab('advance');
        document.getElementById('advanceReceivedInput').focus();
        return;
      }

      // All validations passed -> Save to in-memory history
      const savedDocNo = formatOrderNumber(nextOrderNum);
      const newOrder = {
        docNo: savedDocNo,
        customer: document.getElementById('customerInput').value.trim() || 'WALK-IN',
        name: document.getElementById('nameInput').value.trim(),
        mobile: mobile,
        customerRefNo: document.getElementById('refNoInput').value.trim(),
        currency: 'INR',
        status: 'Open',
        postingDate: document.getElementById('postingDateInput').value,
        deliveryDate: deliveryDate,
        docDate: document.getElementById('docDateInput').value,
        items: validLines.map(line => ({ ...line })),
        paymentMode: document.getElementById('paymentModeSelect').value,
        advanceReceived: advanceReceived,
        balanceDue: Math.max(0, currentCalculations.paymentDue - advanceReceived),
        remarks: document.getElementById('remarksInput').value.trim(),
        salesEmployee: document.getElementById('salesEmployeeSelect').value,
        owner: document.getElementById('ownerInput').value,
        totals: { ...currentCalculations }
      };

      ordersHistory.push(newOrder);

      // Increase order number
      nextOrderNum++;

      // Reset screen for next order
      resetForm();

      // Show green success message
      showMessage(`${savedDocNo} added.`, 'success');
    }

    // Cancel Order Handler
    function handleCancelOrder() {
      resetForm();
      clearMessage();
    }

    // Run on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
