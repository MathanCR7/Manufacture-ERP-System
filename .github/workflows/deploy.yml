name: Deploy Manufacturing ERP to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  validate_and_build:
    name: Build & Validate Code
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm install --legacy-peer-deps

      - name: Validate Production Build
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  deploy_to_vps:
    name: Deploy to VPS Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$PATH"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" || true
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true

            echo "🚀 Starting Automated Deployment for erp.leonex.net..."

            # Ensure deployment directory exists
            if [ ! -d "/var/www/manufacture-erp" ]; then
              echo "Cloning repository for the first time..."
              sudo mkdir -p /var/www/manufacture-erp
              sudo chown -R $USER:$USER /var/www/manufacture-erp
              git clone https://github.com/MathanCR7/Manufacture-ERP-System.git /var/www/manufacture-erp
            fi

            cd /var/www/manufacture-erp

            # Pull latest changes from main branch
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure postgres database exists
            if command -v psql > /dev/null 2>&1; then
              sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'erp_manufacture'" | grep -q 1 || \
              sudo -u postgres psql -c "CREATE DATABASE erp_manufacture;" || true
            fi

            # Ensure backend .env exists
            if [ ! -f "/var/www/manufacture-erp/apps/backend/.env" ]; then
              echo "Creating initial backend .env file..."
              cp /var/www/manufacture-erp/apps/backend/.env.example /var/www/manufacture-erp/apps/backend/.env
            fi

            # Backend deployment
            echo "⚙️ Updating Backend dependencies and Prisma schema..."
            cd /var/www/manufacture-erp/apps/backend
            npm install || true
            npx prisma generate || true
            npx prisma db push --accept-data-loss || true
            node src/database/migrations/ensure_production_batches_redesign_schema.js || true
            node src/database/migrations/run_standard_production_migration.js || true
            if command -v psql > /dev/null 2>&1; then
              sudo -u postgres psql -d erp_manufacture -c "GRANT ALL PRIVILEGES ON SCHEMA public TO leonex_web_user, erp_user, PUBLIC; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO leonex_web_user, erp_user, PUBLIC; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO leonex_web_user, erp_user, PUBLIC; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO leonex_web_user, erp_user, PUBLIC; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO leonex_web_user, erp_user, PUBLIC;" 2>/dev/null || true
            fi

            # Reload or start PM2 daemon
            echo "🔄 Reloading PM2 backend process..."
            pm2 reload erp-backend --update-env || pm2 restart erp-backend || pm2 start src/server.js --name "erp-backend" || true
            pm2 save || true

            # Frontend deployment
            echo "🎨 Building Frontend..."
            cd /var/www/manufacture-erp/apps/frontend
            npm install --legacy-peer-deps || true
            npm run build || true

            # Ensure Nginx virtual host for erp.leonex.net is enabled
            if [ ! -f "/etc/nginx/sites-enabled/erp.leonex.net" ]; then
              echo "Linking Nginx site configuration for erp.leonex.net..."
              sudo cp /var/www/manufacture-erp/deploy/nginx/erp.leonex.net.conf /etc/nginx/sites-available/erp.leonex.net || true
              sudo ln -sf /etc/nginx/sites-available/erp.leonex.net /etc/nginx/sites-enabled/erp.leonex.net || true
            fi

            # Ensure correct file permissions
            sudo chown -R www-data:www-data /var/www/manufacture-erp/apps/frontend/dist 2>/dev/null || true
            sudo chmod -R 755 /var/www/manufacture-erp/apps/frontend/dist 2>/dev/null || true

            # Test and reload Nginx
            sudo nginx -t || true
            sudo systemctl reload nginx || true

            echo "========================================================"
            echo "✅ Deployment finished successfully! erp.leonex.net is live!"
            echo "========================================================"
